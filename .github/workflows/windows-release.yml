# Fork-friendly Windows build: compiles the Release package and uploads the
# zip as a GitHub Actions artifact. The upstream nightly.yml instead pushes
# packages to a private Cloudflare R2 bucket (needs R2 secrets/vars that do
# not exist on forks), so it can never produce a downloadable build here.
name: Windows Build (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-preflight:
    uses: ./.github/workflows/windows-build-preflight.yml

  build-windows:
    needs: windows-preflight
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      BUILD_DIR: b

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'

      - name: Set CUDA versioned environment
        shell: pwsh
        run: |
          "CUDA_PATH_V12_8=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-03-12
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = $env:BUILD_DIR
          $cmakeArgs = "-B $buildDir -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF"
          $retryablePatterns = @(
            'status code 5\d\d',
            'timed out',
            'timeout',
            'connection reset',
            'failed to connect',
            'temporarily unavailable',
            'tls',
            'ssl'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt/3"
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake $cmakeArgs"

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $shouldRetry = $false
            $manifestLog = Join-Path $buildDir 'vcpkg-manifest-install.log'
            if (Test-Path $manifestLog) {
              foreach ($pattern in $retryablePatterns) {
                if (Select-String -Path $manifestLog -Pattern $pattern -Quiet) {
                  $shouldRetry = $true
                  break
                }
              }
            }

            if (-not $shouldRetry -or $attempt -eq 3) {
              exit $LASTEXITCODE
            }

            Write-Warning "Retryable configure failure detected, cleaning build tree before retry."
            if (Test-Path $buildDir) {
              Remove-Item -Recurse -Force $buildDir
            }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Dump failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $buildDir = $env:BUILD_DIR
          $paths = @(
            "$buildDir\vcpkg-manifest-install.log",
            "$buildDir\vcpkg_installed\vcpkg\issue_body.md",
            "$buildDir\CMakeFiles\CMakeConfigureLog.yaml",
            "$buildDir\CMakeError.log",
            "$buildDir\CMakeFiles\CMakeOutput.log",
            "$buildDir\CMakeCache.txt"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "::group::$path"
              Get-Content $path -Tail 400
              Write-Host "::endgroup::"
            }
          }

      - name: Install and verify package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install $env:BUILD_DIR --prefix dist
          # nvjpeg2k_0.dll installs to dist\bin via CMAKE_INSTALL_BINDIR; search
          # recursively so the check does not depend on the exact layout.
          $runtime = Get-ChildItem dist -Filter 'nvjpeg2k_0.dll' -Recurse | Select-Object -First 1
          $extensionDir = Join-Path 'dist' 'extensions'
          $extensions = @(Get-ChildItem $extensionDir -Filter 'nvjpeg2k_ext*.dll' -ErrorAction SilentlyContinue)
          if (-not $runtime) {
            throw "nvJPEG2000 runtime DLL was not installed into the package"
          }
          if ($extensions.Count -eq 0) {
            throw "nvjpeg2k extension DLL was not installed into $extensionDir"
          }
          Write-Host "Found nvJPEG2000 runtime: $($runtime.FullName)"
          $extensions | ForEach-Object { Write-Host "Found nvjpeg2k extension: $($_.FullName)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dateStamp = Get-Date -AsUTC -Format "yyyyMMdd"
          $shortSha = (git rev-parse --short HEAD).Trim()
          $targetVersionFile = ".github/nightly-target-version.txt"
          $nightlyTargetVersion = $null
          if (Test-Path $targetVersionFile) {
            $nightlyTargetVersion = Get-Content $targetVersionFile |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($nightlyTargetVersion) -or $nightlyTargetVersion -eq "SET_ME") {
            $packageVersion = "$dateStamp-$shortSha"
          } else {
            $packageVersion = "$nightlyTargetVersion-$dateStamp-$shortSha"
          }
          $packageName = "LichtFeld-Studio-windows-v$packageVersion.zip"
          Compress-Archive -Path dist\* -DestinationPath $packageName
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $packageName"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-windows-v${{ steps.package.outputs.package_version }}
          path: ${{ steps.package.outputs.package_name }}
          if-no-files-found: error
          retention-days: 30
